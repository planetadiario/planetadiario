name: Tarefas agendadas

# disparado pelo cron do Cloudflare (que só pode rodar ~30 s): aqui a rota interna
# roda até o fim (análise da IA, Instagram, métricas)
on:
  workflow_dispatch:
    inputs:
      rota:
        description: "rota interna (coletar?grupo=par, metricas, aprendizados, instagram-pendente)"
        required: true

concurrency:
  # as duas coletas (par/ímpar) nunca rodam juntas: duas ao mesmo tempo publicavam o mesmo assunto
  group: tarefa-${{ startsWith(inputs.rota, 'coletar') && 'coletar' || startsWith(inputs.rota, 'instagram') && 'redes' || inputs.rota }}
  cancel-in-progress: false

jobs:
  tarefa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: startsWith(inputs.rota, 'coletar')
      - name: Google Notícias (temas monitorados e manchetes do Brasil)
        # o Google bloqueia os servidores do Cloudflare; daqui funciona
        if: startsWith(inputs.rota, 'coletar')
        continue-on-error: true
        env:
          SUPABASE_URL: https://ilnmrhgnaojgykkresfi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 pipeline/temas.py
      - name: Executar
        env:
          ROTA: ${{ inputs.rota }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: |
          # uma ou mais rotas separadas por espaço (cada uma é uma execução própria do worker)
          for r in $ROTA; do
            echo "== $r"
            curl -sS -m 840 -X POST -H "x-internal-secret: $INTERNAL_SECRET" "https://planetadiario.online/api/interno/$r" | head -c 4000 || true
            echo
          done
