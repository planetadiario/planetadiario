name: Montar Reel
run-name: "Reel ${{ inputs.reel_id }}"

on:
  workflow_dispatch:
    inputs:
      reel_id:
        description: ID do reel no Supabase
        required: true
      auto_publicar:
        description: Publicar no Facebook ao terminar
        default: "false"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Instalar dependências
        run: pip install -U -r pipeline/requirements.txt
      - name: Montar
        working-directory: pipeline
        env:
          SUPABASE_URL: https://ilnmrhgnaojgykkresfi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-opus-5-5
          WORKER_URL: https://planetadiario.online
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: python main.py --reel "${{ inputs.reel_id }}" ${{ inputs.auto_publicar == 'true' && '--auto-publicar' || '' }}
