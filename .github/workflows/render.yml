name: Montar Reel
run-name: "Reel ${{ inputs.reel_id }}"

on:
  workflow_dispatch:
    inputs:
      reel_id:
        description: ID do reel no Supabase
        required: true
      auto_publicar:
        description: Publicar no Facebook ao terminar
        default: "false"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Cloudflare WARP (proxy para os downloads)
        id: warp
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for i in $(seq 1 15); do curl -s --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on" && break; sleep 2; done
          curl -s --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(warp|colo)="
          echo "proxy=socks5://127.0.0.1:40000" >> "$GITHUB_OUTPUT"
      - name: Cache das vozes e do Whisper
        uses: actions/cache@v4
        with:
          path: |
            pipeline/vozes
            ~/.cache/huggingface
          key: modelos-v1
      - name: Instalar dependências
        run: pip install -U -r pipeline/requirements.txt
      - name: Montar
        working-directory: pipeline
        env:
          SUPABASE_URL: https://ilnmrhgnaojgykkresfi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IA_MODELO: nvidia/nemotron-3.5-super-vl-120b-a12b
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          WORKER_URL: https://planetadiario.online
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          YTDLP_PROXY: ${{ steps.warp.outputs.proxy }}
        run: python main.py --reel "${{ inputs.reel_id }}" ${{ inputs.auto_publicar == 'true' && '--auto-publicar' || '' }}
